<!doctype html>
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src chrome:; img-src chrome:; object-src 'none'; base-uri 'none'"
    />
    <meta name="color-scheme" content="light dark" />
    <title data-l10n-id="konafox-about-title"></title>
    <link rel="icon" href="chrome://branding/content/about-logo.svg" />
    <link rel="localization" href="branding/brand.ftl" />
    <link rel="localization" href="branding/konafox.ftl" />
    <link rel="stylesheet" href="chrome://global/skin/in-content/common.css" />
    <link
      rel="stylesheet"
      href="chrome://konafox/content/about/aboutKonaFox.css"
    />
  </head>
  <body>
    <main>
      <header>
        <img
          class="logo"
          src="chrome://branding/content/about-logo.svg"
          alt=""
          width="100"
          height="100"
        />
        <p class="eyebrow" data-l10n-id="konafox-about-edition"></p>
        <h1 data-l10n-id="konafox-about-title"></h1>
        <p class="intro" data-l10n-id="konafox-about-intro"></p>
      </header>
      <dl class="versions">
        <div>
          <dt data-l10n-id="konafox-about-version"></dt>
          <dd id="konafox-version">@KONAFOX_VERSION@</dd>
        </div>
        <div>
          <dt data-l10n-id="konafox-about-waterfox"></dt>
          <dd id="waterfox-version">@KONAFOX_WATERFOX_VERSION@</dd>
        </div>
        <div>
          <dt data-l10n-id="konafox-about-gecko"></dt>
          <dd id="gecko-version">@KONAFOX_GECKO_VERSION@</dd>
        </div>
        <div>
          <dt data-l10n-id="konafox-about-target"></dt>
          <dd id="build-target">@KONAFOX_TARGET@</dd>
        </div>
      </dl>
      <section>
        <h2 data-l10n-id="konafox-about-private"></h2>
        <p data-l10n-id="konafox-about-project"></p>
        <p data-l10n-id="konafox-about-art"></p>
        <p data-l10n-id="konafox-about-updates"></p>
      </section>
      <nav>
        <a href="about:preferences" data-l10n-id="konafox-about-settings"></a>
        <a href="about:support" data-l10n-id="konafox-about-build"></a>
        <a
          href="https://github.com/BrowserWorks/waterfox"
          data-l10n-id="konafox-about-waterfox-link"
        ></a>
      </nav>
    </main>
  </body>
</html>
