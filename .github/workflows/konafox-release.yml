name: KonaFox Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: konafox-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Swmarly/konafox' && github.ref_name == github.event.repository.default_branch
    runs-on: ${{ fromJSON(vars.KONAFOX_WINDOWS_RUNNER || '["self-hosted", "Windows", "X64", "konafox"]') }}
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build installer and signed update
        id: build
        shell: pwsh
        env:
          KONAFOX_MAR_PRIVATE_KEY: ${{ secrets.KONAFOX_MAR_PRIVATE_KEY }}
        run: ./konafox/release/build.ps1
      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: konafox-release
          path: ${{ steps.build.outputs.release-directory }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: konafox-release-logs
          path: artifacts/release-*.log
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: konafox/release
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: konafox-release
          path: release-files
      - name: Install release tools
        run: |
          python3 -m venv "$RUNNER_TEMP/release-venv"
          "$RUNNER_TEMP/release-venv/bin/python" -m pip install -r konafox/release/requirements.txt
      - name: Publish release and advance update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/release-venv/bin/python" konafox/release/publish.py release-files'
